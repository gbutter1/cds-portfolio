version: 2

models:
  - name: stg_schools
    columns:
      - name: school_code
        tests: [unique, not_null]
      - name: school_level
        tests:
          - accepted_values:
              arguments:
                values: ['Elementary', 'Middle', 'High']

  - name: stg_students
    columns:
      - name: student_id
        tests: [unique, not_null]
      - name: school_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_schools')
                field: school_code
      - name: enrollment_date
        tests: [not_null]

  - name: stg_calendar
    columns:
      - name: calendar_date
        tests: [unique, not_null]

  - name: stg_attendance
    description: Typed daily attendance with a dq_status on every row. Only dq_status = 'valid' feeds the marts.
    columns:
      - name: dq_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['valid', 'duplicate', 'invalid_status', 'non_school_day', 'unknown_student', 'outside_enrollment']
      - name: attendance_date
        tests: [not_null]
