version: 2

models:
  - name: stg_hc_facilities
    columns:
      - name: facility_id
        tests: [unique, not_null]

  - name: stg_hc_encounters
    description: Typed encounters with normalized ICD-10 codes and a dq_status on every row.
    columns:
      - name: dq_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['valid', 'duplicate', 'invalid_date', 'unknown_facility', 'missing_code', 'invalid_code']

  - name: stg_hc_cdc_ili
    columns:
      - name: epiweek
        tests: [unique, not_null]
      - name: week_start
        tests: [unique, not_null]
